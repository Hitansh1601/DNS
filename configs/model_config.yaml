random_state: 42
test_size: 0.2
val_size: 0.15  # fraction of train for validation during tuning
stratify: true

# Target discovery. Do NOT assume a name. First existing column in this list wins,
# otherwise auto-detect low-cardinality object column. Override with target: "<name>".
target_candidates:
  - label
  - class
  - category
  - attack
  - Label
  - Class
  - target
target: null

# Label normalization: lower -> canonical
# Binary: benign vs attack (light+heavy merged)
# Multiclass: benign / light / heavy  (only if source labels support it)
binary_map:
  benign: 0
  normal: 0
  light_attack: 1
  heavy_attack: 1
  attack: 1
  malicious: 1
  exfiltration: 1
multiclass_map:
  benign: 0
  normal: 0
  light_attack: 1
  light: 1
  heavy_attack: 2
  heavy: 2
  attack: 1

# Columns that are never features (exact match, case-insensitive handled in code)
drop_exact:
  - timestamp
  - time
  - datetime

# Regex patterns for suspected leakage / environment-specific identifiers.
# IMPORTANT: only match true identifiers (IPs, sessions, timestamps), NOT
# aggregated DNS features like distinct_ip / distinct_domains / FQDN_count
# which are legitimate model inputs. Use anchored exact names for those.
leakage_patterns:
  - "^src_ip$"
  - "^dst_ip$"
  - "^srcip$"
  - "^dstip$"
  - "^client_ip$"
  - "^server_ip$"
  - ".*\\bsrc\\b.*"
  - ".*\\bdst\\b.*"
  - ".*session.*"
  - ".*capture.*"
  - ".*pcap.*"
  - ".*timestamp.*"
  - "^id$"
  - ".*_id$"
  - "^host$"
  - "^domain$"
  - "^fqdn$"

# If true, drop leakage-pattern columns for the main model and run with/without ablation.
drop_leakage_columns: true
ablation_leakage: true

models:
  logreg:
    max_iter: 1000
    class_weight: balanced
    C: 1.0
  rf:
    n_estimators: 200
    max_depth: null
    min_samples_split: 2
    class_weight: balanced_subsample
    n_jobs: -1
  xgb:
    n_estimators: 300
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    reg_alpha: 0.0
    reg_lambda: 1.0
    n_jobs: 1
    tree_method: hist

tuning:
  enabled: true
  cv: 3
  n_iter: 12  # randomized search iterations for RF/XGB
  # Small search spaces (kept cheap for student hardware; expand for real CIC run)
  rf_grid:
    n_estimators: [100, 200]
    max_depth: [null, 12, 20]
    min_samples_split: [2, 5]
  xgb_grid:
    n_estimators: [200, 300]
    max_depth: [4, 6]
    learning_rate: [0.03, 0.05, 0.1]
    subsample: [0.8, 1.0]

cv:
  folds: 3  # stratified K-fold on train split only (test never touched)

threshold:
  # Security tradeoff: report F1-optimal threshold in addition to default 0.5
  tune_binary_threshold: true

shap:
  background_sample: 200
  explain_sample: 500

paths:
  synthetic_csv: data/synthetic_dns_demo.csv
  pipeline_binary: models/pipeline_binary.joblib
  pipeline_multiclass: models/pipeline_multiclass.joblib
  metrics_json: reports/metrics.json
  figures_dir: reports/figures
